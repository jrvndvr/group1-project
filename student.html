<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 680px;
        }
        .form-image {
            width: 100%;
            height: auto;
            border-radius: 6px;
            margin-bottom: 15px;
            display: block;
        }
        iframe {
            width: 100%;
            height: 800px;
            border: none;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <!-- Added Image Tag -->
        
        <!-- Google Form Embedded -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScvyrwAg11E4LLzLbp5oxw8DXTpymVc-3AuELG5gIxa5e-whQ/viewform?usp=dialog"></iframe> 
        <a href="SCHEDULE.HTML">
        <button type="button">SCHEDULE</button>
        </a>
    </div>

</body>
</html>
