<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style> :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;    
            --accent-color: #0f172a;
            --badge-bg: #f1f5f9;
            --badge-text: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .portal-card {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .portal-header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
        }

        .header-title h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .header-title p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .iframe-container {
            width: 100%;
            background-color: #ffffff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 750px;
            border: none;
            display: block;
        }

        .portal-footer {
            padding: 12px 32px;
            background-color: #f8fafc;
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <header class="portal-header">
            <div class="header-title">
                <h1> Data Base </h1>
                <p>All the Data</p>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span> Active
            </div>
        </header>

        <div class="iframe-container">
            <iframe src="https://docs.google.com/spreadsheets/d/1RayQGt2Hy4O99YDZaRxEFXpOyhnEGDtJ1ZvDGJg19QY/edit?usp=sharing">Loading…</iframe>
        </div>

        <footer class="portal-footer">
            <span>Secure Connection</span>
            <span>Powered by Taguig City University</span>
        </footer>
    </div>

</body>
</html>

</style>
</body>
</html>
