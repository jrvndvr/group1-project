<!DOCTYPE html>

<style>
/* Main page design */
body {
  margin: 0;
  font-family: Arial;
  background-color: rgb(63, 179, 211);
}

/* Top navigation bar */
ul {
  background-color: navy;
  list-style-type: none;
  margin: 0;
  padding: 15px;
  display: flex;
  align-items: center;
}

/* Logo */
.logo {
  color: white;
  font-size: 25px;
  font-weight: bold;
  margin-right: 25px;
}

/* Each menu item */
li {
  position: relative;
}

/* Menu links */
li a {
  color: white;
  padding: 15px;
  text-decoration: none;
  display: block;
}

/* Menu hover color */
li a:hover {
  background-color: skyblue;
  color: black;
}

/* Dropdown menu */
.dropdown {
  display: none;
  position: absolute;
  background-color: skyblue;
  min-width: 150px;
}

/* Show dropdown when mouse is over My Website */
li:hover .dropdown {
  display: block;
}

/* Dropdown links */
.dropdown a {
  padding: 12px;
}

/* Dropdown hover color */
.dropdown a:hover {
  background-color: navy;
  color: black;
}

/* Main page content */
.content {
  text-align: center;
  padding: 60px;
}

/* Main heading */
h1 {
  color: black;
}

/* Subheading */
h2 {
  color: brown;
}

/* Button design */
button {
  padding: 12px 20px;
  background-color: yellow;
  color: black;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

/* Social media links */
.social {
  margin-top: 30px;
}

.social a {
  color: red;
  text-decoration: none;
  margin: 10px;
  font-weight: bold;
}

            text-align: center;
            margin: 30px auto;
            font-size: 22px;
            font-weight: bold;
            padding: 15px 30px;
            width: 300px;
         
        }
</style>
